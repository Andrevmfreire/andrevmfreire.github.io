<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://andrevmfreire.vercel.app">
    <link rel="canonical" href="https://andrevmfreire.vercel.app">
    <title>Redirecting...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0d0d0d;
            color: #e8e8e8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }

        p {
            color: #8a8a8a;
            margin-bottom: 2rem;
            font-size: 1rem;
            line-height: 1.6;
        }

        .spinner {
            width: 50px;
            height: 50px;
            margin: 2rem auto;
            border: 3px solid #2a2a2a;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        a {
            color: #fff;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border: 1px solid #fff;
            display: inline-block;
            margin-top: 1rem;
            transition: all 0.3s;
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        a:hover {
            background: #fff;
            color: #0d0d0d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Redirecting...</h1>
        <p>You're being redirected to the new site.</p>
        <div class="spinner"></div>
        <p>If you're not redirected automatically, click below:</p>
        <a href="https://andrevmfreire.vercel.app">Go to New Site</a>
    </div>

    <script>
        // Redirecionamento via JavaScript (backup)
        setTimeout(() => {
            window.location.href = 'https://andrevmfreire.vercel.app';
        }, 500);
    </script>
</body>
</html>
